name: Fix executable modes

on:
  push:
    branches: [feat/executable-adapters-v2]
    paths:
      - ".github/workflows/fix-modes.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/executable-adapters-v2
          fetch-depth: 0
          persist-credentials: true

      - name: Preserve executable adapter entrypoints
        shell: bash
        run: |
          set -euo pipefail
          chmod +x skills/analyze-coding-session/scripts/run.mjs
          chmod +x skills/prove-running-product/scripts/run.mjs
          rm .github/workflows/fix-modes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve executable adapter entrypoints"
          git push origin HEAD:feat/executable-adapters-v2
