name: Materialize source

on:
  push:
    branches: [feat/executable-adapters]
    paths:
      - ".bootstrap/chunks/**"
      - ".github/workflows/materialize-source.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out staging branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/executable-adapters
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct and validate source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunks/part.* | tr -d '\r\n' | base64 --decode > /tmp/inference-skills.tar.gz
          echo "382c5bfc01e30709ed2af7f617e7e6caf5b9badda2d828f1ae508ed6c1d4f64e  /tmp/inference-skills.tar.gz" | sha256sum --check --strict
          tar -tzf /tmp/inference-skills.tar.gz > /tmp/inference-skills-files.txt
          grep -Fxq './package.json' /tmp/inference-skills-files.txt
          grep -Fxq './src/runner.mjs' /tmp/inference-skills-files.txt
          grep -Fxq './skills/analyze-coding-session/SKILL.md' /tmp/inference-skills-files.txt
          grep -Fxq './skills/prove-running-product/SKILL.md' /tmp/inference-skills-files.txt

      - name: Materialize repository source
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/materialize-source.yml /tmp/materialize-source.yml
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/inference-skills.tar.gz -C .
          mkdir -p .github/workflows
          cp /tmp/materialize-source.yml .github/workflows/materialize-source.yml
          chmod +x skills/analyze-coding-session/scripts/run.mjs
          chmod +x skills/prove-running-product/scripts/run.mjs
          test -f package-lock.json
          test -f scripts/package-smoke.mjs

      - name: Commit materialized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add executable product adapters"
          git push origin HEAD:feat/executable-adapters
